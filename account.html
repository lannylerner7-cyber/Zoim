<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in | Zoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- Banner CDN: open the connection early and preload the hero image (it's the LCP element) -->
<link rel="preconnect" href="https://st1.zoom.us">
<link rel="dns-prefetch" href="https://st1.zoom.us">
<link rel="preload" as="image" href="https://st1.zoom.us/fe-static/fe-signup-login-active-v3/assets/banner-step-1.DTtJ7nly.png" fetchpriority="high">
<style>
  /* ============ Reset & tokens ============ */
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --zoom-blue: #0B5CFF;
    --zoom-blue-dark: #0845BF;
    --ink: #131619;            /* heading */
    --text: #232333;           /* body copy */
    --muted: #6E7687;          /* placeholder */
    --hero-bg: #F5F7F9;        /* light banner gray */
    --line: #D9DDE3;           /* divider lines */
    --input-border: #C9CDD6;   /* field outline */
    --card-border: #E4E4ED;    /* icon card outline */
    --white: #FFFFFF;
  }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    font-family: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--white);
    color: var(--text);
    line-height: 1.5;
  }

  img {
    display: block;
    max-width: 100%;
  }

  a {
    text-decoration: none;
    color: var(--zoom-blue);
  }

  a:hover {
    text-decoration: underline;
    color: var(--zoom-blue-dark);
  }

  a:focus-visible,
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--zoom-blue);
    outline-offset: 3px;
    border-radius: 4px;
  }

  /* ============ Thin dark strip at very top ============ */
  .top-bar {
    height: 12px;
    background: #0D0D0D;
  }

  /* ============ Hero banner ============ */
  .hero {
    background: var(--hero-bg);
    border-radius: 0 0 24px 24px;
    height: 340px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
  }

  .hero img,
  .hero .banner-fallback {
    height: 310px;
    width: auto;
    margin-bottom: -72px;  /* illustration overflows below the gray banner */
  }

  .hero img {
    aspect-ratio: auto 16 / 10;  /* placeholder ratio before load; intrinsic ratio wins after */
    object-fit: contain;
  }

  .hero .banner-fallback {
    display: none;  /* shown by the img onerror handler if the CDN file is unavailable */
  }

  /* ============ Single-column content ============ */
  .content {
    text-align: center;
    padding: 148px 24px 72px;  /* clears the overflowing banner illustration */
  }

  .content h1 {
    font-size: clamp(38px, 5vw, 52px);
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--ink);
  }

  /* ---- Email + Next ---- */
  .signin-form {
    width: 440px;
    max-width: 100%;
    margin: 64px auto 0;
  }

  .signin-form input {
    width: 100%;
    height: 54px;
    padding: 0 24px;
    font-family: inherit;
    font-size: 19px;
    color: var(--ink);
    background: var(--white);
    border: 1px solid var(--input-border);
    border-radius: 12px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .signin-form input::placeholder {
    color: var(--muted);
  }

  .signin-form input:focus {
    outline: none;
    border-color: var(--zoom-blue);
    box-shadow: 0 0 0 3px rgba(11, 92, 255, 0.15);
  }

  .btn-next {
    display: block;
    width: 100%;
    height: 54px;
    margin-top: 20px;
    font-family: inherit;
    font-size: 19px;
    font-weight: 600;
    color: var(--white);
    background: var(--zoom-blue);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  .btn-next:hover {
    background: var(--zoom-blue-dark);
  }

  /* ---- "Or sign in with" divider ---- */
  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 470px;
    max-width: 100%;
    margin: 52px auto 0;
    font-size: 17px;
    color: var(--text);
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* ---- Social sign-in row ---- */
  .sso-row {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 34px;
    margin-top: 44px;
    list-style: none;
  }

  .sso-row a {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    color: var(--text);
  }

  .sso-row a:hover {
    text-decoration: none;
    color: var(--text);
  }

  .icon-card {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 60px;
    height: 60px;
    background: var(--white);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .sso-row a:hover .icon-card {
    border-color: #C9CDE0;
    box-shadow: 0 4px 12px rgba(19, 22, 25, 0.08);
  }

  .icon-card svg {
    width: 26px;
    height: 26px;
  }

  .sso-label {
    margin-top: 14px;
    font-size: 17px;
    font-weight: 500;
  }

  /* ---- Forgot email ---- */
  .forgot {
    margin-top: 64px;
    font-size: 19px;
  }

  /* ---- Help / Terms / Privacy ---- */
  .foot-links {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-top: 56px;
    font-size: 19px;
  }

  /* ---- reCAPTCHA notice ---- */
  .recaptcha {
    max-width: 500px;
    margin: 32px auto 0;
    font-size: 18px;
    line-height: 1.6;
  }

  /* ============ Responsive ============ */
  @media (max-width: 768px) {
    .hero {
      height: 250px;
      border-radius: 0 0 18px 18px;
    }
    .hero img,
    .hero .banner-fallback {
      height: 215px;
      margin-bottom: -50px;
    }
    .content {
      padding: 104px 20px 56px;
    }
    .signin-form {
      margin-top: 44px;
    }
    .signin-form input,
    .btn-next {
      height: 50px;
      font-size: 17px;
    }
    .sso-row {
      gap: 16px;
      flex-wrap: wrap;
    }
    .icon-card {
      width: 54px;
      height: 54px;
      border-radius: 16px;
    }
    .icon-card svg {
      width: 23px;
      height: 23px;
    }
    .sso-label {
      font-size: 15px;
      margin-top: 10px;
    }
    .forgot {
      margin-top: 48px;
      font-size: 17px;
    }
    .foot-links {
      margin-top: 44px;
      gap: 20px;
      font-size: 17px;
    }
    .recaptcha {
      font-size: 16px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }
</style>
</head>
<body>

  <!-- Thin black strip across the very top -->
  <div class="top-bar"></div>

  <!-- ============ Top banner (light gray, rounded bottom) ============ -->
  <section class="hero">
    <!-- Direct banner src, fully configured:
         loading="eager" + fetchpriority="high"  -> above-the-fold LCP image, load it first
         decoding="async"                        -> don't block rendering while decoding
         referrerpolicy="no-referrer"            -> clean cross-origin request to the CDN
         onerror                                 -> swap to the inline SVG below if the
                                                    hashed CDN file (DTtJ7nly) ever changes -->
    <img
      src="https://st1.zoom.us/fe-static/fe-signup-login-active-v3/assets/banner-step-1.DTtJ7nly.png"
      alt="Illustration of two people arranging video tiles on a Zoom meeting window"
      loading="eager"
      fetchpriority="high"
      decoding="async"
      referrerpolicy="no-referrer"
      onerror="this.onerror=null;this.style.display='none';this.nextElementSibling.style.display='block';">

    <!-- Offline/CDN-failure fallback: simplified meeting window + two people -->
    <svg class="banner-fallback" viewBox="0 0 640 340" role="img" aria-label="Illustration of two people arranging video tiles on a Zoom meeting window">
      <!-- browser-style window -->
      <rect x="170" y="16" width="320" height="240" rx="8" fill="#16294D"/>
      <rect x="170" y="16" width="320" height="20" rx="8" fill="#E8EAEE"/>
      <rect x="170" y="28" width="320" height="8" fill="#E8EAEE"/>
      <circle cx="182" cy="26" r="3" fill="#E5484D"/>
      <circle cx="192" cy="26" r="3" fill="#F5A623"/>
      <circle cx="202" cy="26" r="3" fill="#34A853"/>
      <!-- participant tiles (3 x 3) -->
      <g>
        <rect x="180" y="44" width="96" height="58" rx="3" fill="#3E6AB8"/>
        <rect x="284" y="44" width="96" height="58" rx="3" fill="#2D4E8F"/>
        <rect x="388" y="44" width="94" height="58" rx="3" fill="#3E6AB8"/>
        <rect x="180" y="108" width="96" height="58" rx="3" fill="#2D4E8F"/>
        <rect x="284" y="108" width="96" height="58" rx="3" fill="#3E6AB8"/>
        <rect x="388" y="108" width="94" height="58" rx="3" fill="#2D4E8F"/>
        <rect x="180" y="172" width="96" height="58" rx="3" fill="#3E6AB8"/>
        <rect x="284" y="172" width="96" height="58" rx="3" fill="#2D4E8F"/>
        <rect x="388" y="172" width="94" height="58" rx="3" fill="#3E6AB8"/>
      </g>
      <!-- silhouettes -->
      <g fill="#16294D" opacity="0.85">
        <circle cx="228" cy="64" r="11"/><rect x="210" y="75" width="36" height="27" rx="12"/>
        <circle cx="332" cy="64" r="11"/><rect x="314" y="75" width="36" height="27" rx="12"/>
        <circle cx="435" cy="64" r="11"/><rect x="417" y="75" width="36" height="27" rx="12"/>
        <circle cx="228" cy="128" r="11"/><rect x="210" y="139" width="36" height="27" rx="12"/>
        <circle cx="332" cy="128" r="11"/><rect x="314" y="139" width="36" height="27" rx="12"/>
        <circle cx="435" cy="128" r="11"/><rect x="417" y="139" width="36" height="27" rx="12"/>
        <circle cx="228" cy="192" r="11"/><rect x="210" y="203" width="36" height="27" rx="12"/>
        <circle cx="332" cy="192" r="11"/><rect x="314" y="203" width="36" height="27" rx="12"/>
        <circle cx="435" cy="192" r="11"/><rect x="417" y="203" width="36" height="27" rx="12"/>
      </g>
      <!-- meeting control bar -->
      <circle cx="290" cy="243" r="3" fill="#5F7290"/>
      <circle cx="302" cy="243" r="3" fill="#5F7290"/>
      <rect x="312" y="238" width="18" height="10" rx="2" fill="#34A853"/>
      <circle cx="342" cy="243" r="3" fill="#5F7290"/>
      <rect x="464" y="238" width="16" height="10" rx="2" fill="#E5484D"/>
      <!-- tile being placed, top right -->
      <rect x="472" y="2" width="54" height="38" rx="3" fill="#3E6AB8" transform="rotate(8 499 21)"/>
      <!-- right person (teal top, navy pants) -->
      <circle cx="560" cy="86" r="13" fill="#E0B69A"/>
      <path d="M548 82c0-9 6-15 13-15s13 6 13 15v30h-7V92h-12v20h-7z" fill="#A0522D"/>
      <rect x="544" y="100" width="34" height="50" rx="12" fill="#2BB39A"/>
      <rect x="514" y="66" width="42" height="10" rx="5" fill="#2BB39A" transform="rotate(-18 535 71)"/>
      <rect x="548" y="150" width="11" height="62" fill="#1D2330"/>
      <rect x="563" y="150" width="11" height="62" fill="#1D2330"/>
      <rect x="544" y="212" width="18" height="8" rx="4" fill="#2C76F7"/>
      <rect x="561" y="212" width="18" height="8" rx="4" fill="#2C76F7"/>
      <!-- left person (pink top, blue pants), standing lower -->
      <circle cx="118" cy="196" r="13" fill="#C98A6B"/>
      <path d="M105 194c0-10 6-16 13-16s13 6 13 16h-26z" fill="#2B2118"/>
      <rect x="102" y="210" width="34" height="48" rx="12" fill="#F2A0B3"/>
      <rect x="126" y="204" width="40" height="10" rx="5" fill="#F2A0B3" transform="rotate(-14 146 209)"/>
      <rect x="132" y="182" width="48" height="36" rx="3" fill="#2C76F7"/>
      <rect x="106" y="258" width="11" height="62" fill="#2C76F7"/>
      <rect x="121" y="258" width="11" height="62" fill="#2C76F7"/>
      <rect x="102" y="320" width="18" height="8" rx="4" fill="#1D2330"/>
      <rect x="119" y="320" width="18" height="8" rx="4" fill="#1D2330"/>
    </svg>
  </section>

  <!-- ============ Single-column sign-in content ============ -->
  <main class="content">
    <h1>Sign in</h1>

    <!-- Email / Zoom Mail / phone + Next -->
    <div class="signin-form">
      <input type="text" placeholder="Enter email, Zoom Mail or phone number"
             aria-label="Enter email, Zoom Mail or phone number"
             autocomplete="username" inputmode="email">
      <button class="btn-next" type="button">Next</button>
    </div>

    <!-- Divider -->
    <div class="divider" role="separator" aria-label="Or sign in with">Or sign in with</div>

    <!-- Social sign-in options -->
    <ul class="sso-row">
      <li>
        <a href="#sso" aria-label="Sign in with SSO">
          <span class="icon-card">
            <!-- key icon -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#131619" d="M12.65 10A5.99 5.99 0 0 0 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6a5.99 5.99 0 0 0 5.65-4H17v4h4v-4h2v-4H12.65zM7 15c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/>
            </svg>
          </span>
          <span class="sso-label">SSO</span>
        </a>
      </li>
      <li>
        <a href="#apple" aria-label="Sign in with Apple">
          <span class="icon-card">
            <!-- Apple logo -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#131619" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.56-1.701"/>
            </svg>
          </span>
          <span class="sso-label">Apple</span>
        </a>
      </li>
      <li>
        <a href="#google" aria-label="Sign in with Google">
          <span class="icon-card">
            <!-- Google G logo -->
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
              <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
              <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24c0 3.55.85 6.91 2.34 9.88l7.35-5.7z"/>
              <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 12.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
            </svg>
          </span>
          <span class="sso-label">Google</span>
        </a>
      </li>
      <li>
        <a href="#facebook" aria-label="Sign in with Facebook">
          <span class="icon-card">
            <!-- Facebook logo -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="12" fill="#1877F2"/>
              <path fill="#FFFFFF" d="M13.4 21v-8.2h2.76l.41-3.2h-3.17V7.55c0-.93.26-1.56 1.59-1.56h1.68V3.13A22 22 0 0 0 14.2 3c-2.44 0-4.12 1.5-4.12 4.23v2.36H7.33v3.2h2.75V21h3.32z"/>
            </svg>
          </span>
          <span class="sso-label">Facebook</span>
        </a>
      </li>
      <li>
        <a href="#microsoft" aria-label="Sign in with Microsoft">
          <span class="icon-card">
            <!-- Microsoft logo -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="1" y="1" width="10.5" height="10.5" fill="#F25022"/>
              <rect x="12.5" y="1" width="10.5" height="10.5" fill="#7FBA00"/>
              <rect x="1" y="12.5" width="10.5" height="10.5" fill="#00A4EF"/>
              <rect x="12.5" y="12.5" width="10.5" height="10.5" fill="#FFB900"/>
            </svg>
          </span>
          <span class="sso-label">Microsoft</span>
        </a>
      </li>
    </ul>

    <!-- Forgot email -->
    <p class="forgot"><a href="https://zoom.us/forgot_password">Forgot email?</a></p>

    <!-- Footer links -->
    <nav class="foot-links" aria-label="Footer">
      <a href="https://support.zoom.us">Help</a>
      <a href="https://zoom.us/terms">Terms</a>
      <a href="https://zoom.us/privacy">Privacy</a>
    </nav>

    <!-- reCAPTCHA notice -->
    <p class="recaptcha">
      Zoom is protected by reCAPTCHA and the Google
      <a href="https://policies.google.com/privacy">Privacy Policy</a> and
      <a href="https://policies.google.com/terms">Terms of Service</a> apply.
    </p>
  </main>

</body>
</html>
