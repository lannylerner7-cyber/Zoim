<style>
  /* ============ Reset & tokens ============ */
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --zoom-blue: #0B5CFF;
    --zoom-blue-dark: #0845BF;
    --ink: #131619;          /* heading */
    --text: #232333;         /* body copy */
    --hero-bg: #F5F7F9;      /* light banner gray */
    --card-border: #E4E4ED;  /* card outline */
    --white: #FFFFFF;
  }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    font-family: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--white);
    color: var(--text);
    line-height: 1.5;
  }

  img {
    display: block;
    max-width: 100%;
  }

  a {
    text-decoration: none;
    color: var(--zoom-blue);
  }

  a:focus-visible {
    outline: 2px solid var(--zoom-blue);
    outline-offset: 4px;
    border-radius: 4px;
  }

  /* ============ Header ============ */
  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--white);
    padding: 32px 64px;
  }

  .logo-link {
    display: inline-flex;
    align-items: center;
  }

  .logo-link img {
    height: 30px;   /* 353x80 wordmark scaled down */
    width: auto;
  }

  .header-nav {
    display: flex;
    align-items: center;
    gap: 44px;
  }

  .header-nav a,
  .lang-btn {
    font-size: 17px;
    font-weight: 500;
    color: var(--zoom-blue);
  }

  .header-nav a:hover {
    text-decoration: underline;
  }

  .lang-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
  }

  .lang-btn:hover {
    text-decoration: underline;
  }

  .lang-btn:focus-visible {
    outline: 2px solid var(--zoom-blue);
    outline-offset: 4px;
    border-radius: 4px;
  }

  .lang-btn svg {
    margin-top: 2px;
  }

  /* ============ Hero banner ============ */
  .hero {
    background: var(--hero-bg);
    border-radius: 0 0 32px 32px;
    height: 440px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
  }

  .hero img,
  .hero .banner-fallback {
    height: 360px;
    width: auto;
    margin-bottom: -88px;  /* monitor overflows below the gray banner */
  }

  .hero img {
    aspect-ratio: auto 16 / 9;  /* placeholder ratio before load; intrinsic ratio wins after */
    object-fit: contain;
  }

  .hero .banner-fallback {
    display: none;  /* shown by the img onerror handler if the CDN file is unavailable */
  }

  /* ============ Main content ============ */
  .content {
    text-align: center;
    padding: 176px 24px 96px; /* clears the overflowing banner image */
  }

  .content h1 {
    font-size: clamp(34px, 4.4vw, 50px);
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--ink);
  }

  .lead {
    font-size: 20px;
    margin-top: 44px;
  }

  /* ---- Download card container ---- */
  .download-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 400px;
    max-width: 100%;
    margin: 56px auto 0;
    padding: 76px 24px 72px;
    background: var(--white);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .download-card:hover {
    border-color: #C9CDE0;
    box-shadow: 0 8px 24px rgba(19, 22, 25, 0.08);
  }

  .download-card img {
    width: 132px;
    height: 132px;
  }

  .download-card span {
    margin-top: 44px;
    font-size: 22px;
    font-weight: 500;
    color: var(--zoom-blue);
  }

  .download-card:hover span {
    text-decoration: underline;
    color: var(--zoom-blue-dark);
  }

  /* ---- Account settings line ---- */
  .settings-line {
    font-size: 20px;
    margin-top: 52px;
  }

  .settings-line a:hover {
    text-decoration: underline;
    color: var(--zoom-blue-dark);
  }

  /* ============ Responsive ============ */
  @media (max-width: 768px) {
    .site-header {
      padding: 20px 24px;
    }
    .logo-link img {
      height: 24px;
    }
    .header-nav {
      gap: 24px;
    }
    .hero {
      height: 300px;
      border-radius: 0 0 24px 24px;
    }
    .hero img,
    .hero .banner-fallback {
      height: 230px;
      margin-bottom: -56px;
    }
    .content {
      padding: 120px 20px 72px;
    }
    .lead {
      margin-top: 28px;
      font-size: 18px;
    }
    .download-card {
      margin-top: 40px;
      padding: 56px 20px 52px;
    }
    .download-card img {
      width: 108px;
      height: 108px;
    }
    .download-card span {
      margin-top: 32px;
      font-size: 20px;
    }
    .settings-line {
      font-size: 18px;
      margin-top: 40px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }
</style>
